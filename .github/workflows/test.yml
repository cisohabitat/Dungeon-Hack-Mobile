name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rules:
    name: Types, generator and rule checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  browser:
    # split three ways: the suite took six minutes on one runner
    name: Browser tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=phone --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  perf:
    # the frame-rate budget (test/browser/perf.spec.js), alone on its runner
    name: Frame-rate budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=perf --workers=1
        # the first reading on a runner was 47, 48 and 60 fps against a bar of 30
        env:
          PERF: '1'

  safari:
    name: Safari engine mobile checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      # Keep native media/navigation teardown from competing across WebKit renderers.
      - run: npx playwright test --project=safari --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-safari
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  small:
    # the smallest phone in the device matrix (docs/DEVICES.md)
    name: Smallest phone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=small
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-small
          path: |
            playwright-report/
            test-results/
          retention-days: 7
