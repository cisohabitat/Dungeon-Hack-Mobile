name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rules:
    name: Types, generator and rule checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run release:check
        env:
          RELEASE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      - run: npm test

  browser:
    # split three ways: the suite took six minutes on one runner
    name: Browser tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=phone --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  perf:
    # the frame-rate budget (test/browser/perf.spec.js), alone on its runner
    name: Frame-rate budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=perf --workers=1
        # the first reading on a runner was 47, 48 and 60 fps against a bar of 30
        env:
          PERF: '1'

  safari:
    name: Safari engine mobile checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run test:webkit
        env:
          DEBUG: pw:browser
      - name: Native browser failure diagnostics
        if: failure()
        run: |
          free -m
          sudo dmesg | rg -i 'out of memory|oom-kill|killed process|segfault' || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-safari
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  small:
    # the smallest phone in the device matrix (docs/DEVICES.md)
    name: Smallest phone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=small
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-small
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  release:
    name: Publish version
    needs: [rules, browser, perf, safari, small]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-main-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
