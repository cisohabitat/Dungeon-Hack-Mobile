name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # Playwright 1.59.1 supports Ubuntu 24.04; ubuntu-latest may roll ahead of it.
  rules:
    name: Types, generator and rule checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run release:check
        env:
          RELEASE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      - run: npm test

  browser:
    # Native Playwright shards; every case still runs once across the matrix.
    name: Browser tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - &runtime-checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Runtime/test inputs plus creature metadata; omit large source art,
          # review captures and audio masters. Sparse checkout fetches blob:none.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/art/*
            /art/creatures/
            !/art/creatures/*
            /art/creatures/*.json
            !/docs/
            !/sound/masters/
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: sh tools/install-browser.sh chromium
      # Full-cache installation checks run alone; competing browser workers
      # exceed their unchanged ten-second installation deadline.
      - run: sh tools/run-browser-ci.sh phone-regular --project=phone --shard=${{ matrix.shard }}/3 --grep-invert 'core play is ready offline|painted creature survives an installed offline|installed offline ending exports'
      - run: sh tools/run-browser-ci.sh phone-offline --project=phone --shard=${{ matrix.shard }}/3 --workers=1 --grep 'core play is ready offline|painted creature survives an installed offline|installed offline ending exports' --pass-with-no-tests
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            ci-diagnostics/
            test-results/
          retention-days: 7

  perf:
    # the frame-rate budget (test/browser/perf.spec.js), alone on its runner
    name: Frame-rate budget
    runs-on: ubuntu-24.04
    steps:
      - *runtime-checkout
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: sh tools/install-browser.sh chromium
      - run: sh tools/run-browser-ci.sh perf --project=perf --workers=1
        # the first reading on a runner was 47, 48 and 60 fps against a bar of 30
        env:
          PERF: '1'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-perf
          path: |
            ci-diagnostics/
            test-results/
          retention-days: 7

  safari:
    name: Safari engine mobile checks (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - *runtime-checkout
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: sh tools/install-browser.sh webkit
      - run: sh tools/run-browser-ci.sh safari --project=safari --workers=1 --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-safari-${{ matrix.shard }}
          path: |
            ci-diagnostics/
            test-results/
          retention-days: 7

  small:
    # the smallest phone in the device matrix (docs/DEVICES.md)
    name: Smallest phone (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - *runtime-checkout
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: sh tools/install-browser.sh chromium
      # Full-cache installation checks run alone; competing browser workers
      # exceed their unchanged ten-second installation deadline.
      - run: sh tools/run-browser-ci.sh small-regular --project=small --shard=${{ matrix.shard }}/2 --grep-invert 'core play is ready offline|painted creature survives an installed offline|installed offline ending exports'
      - run: sh tools/run-browser-ci.sh small-offline --project=small --shard=${{ matrix.shard }}/2 --workers=1 --grep 'core play is ready offline|painted creature survives an installed offline|installed offline ending exports' --pass-with-no-tests
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-small-${{ matrix.shard }}
          path: |
            ci-diagnostics/
            test-results/
          retention-days: 7

  release:
    name: Publish version
    needs: [rules, browser, perf, safari, small]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-main-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
