<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Deepdelve sound check</title>
<style>
  /* the game's own colours (css/style.css), kept apart so the game never loads this */
  :root { --bg: #0b0a10; --panel: #16141f; --border: #3a3450; --text: #e6dfd0; --dim: #9a93a8; --gold: #e0b84a; --press: #2b2740; --on: #4a3a1c; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 16px 48px; background: var(--bg); color: var(--text); font: 16px/1.45 Georgia, 'Times New Roman', serif; }
  h1 { color: var(--gold); font-weight: normal; font-size: 1.5rem; margin: 0 0 4px; }
  h2 { color: var(--gold); font-weight: normal; font-size: 1.15rem; margin: 0; }
  p { margin: 6px 0; color: var(--dim); max-width: 46em; }
  details { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin: 12px 0; padding: 10px 12px; }
  summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 8px; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: '▸'; color: var(--gold); }
  details[open] > summary::before { content: '▾'; }
  summary small { color: var(--dim); }
  button { font: inherit; color: var(--text); background: #1d1a29; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; min-height: 44px; cursor: pointer; }
  button:active { background: var(--press); }
  button.on { background: var(--on); border-color: var(--gold); color: #f5e6c0; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
  .item { border-top: 1px solid var(--border); padding: 8px 0; }
  .item:first-of-type { border-top: 0; }
  .item b { font-weight: normal; color: var(--text); }
  .item .what { color: var(--dim); font-size: 0.9rem; display: block; margin-bottom: 4px; }
  .tier { font-size: 0.75rem; color: var(--bg); background: var(--dim); border-radius: 4px; padding: 0 6px; margin-left: 6px; }
  .tier.t1 { background: var(--gold); }
  .bar { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 8px 0; border-bottom: 1px solid var(--border); }
  #status { color: var(--dim); font-size: 0.9rem; }
  label { color: var(--dim); font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
  input[type=range] { width: 160px; accent-color: var(--gold); }
  .meta { color: var(--dim); font-size: 0.85rem; }
</style>
</head>
<body>
<h1>Deepdelve sound check</h1>
<p>Every sound and piece of music in <code>sound/</code>, to listen to before any of it goes into the game. They are synthesised (see <code>SOURCES.md</code>), not recorded. Use headphones as well as the phone's speaker: the game is mostly heard through the speaker.</p>
<div class="bar">
  <div class="row">
    <span>Format:</span>
    <button id="fmt-m4a" type="button">AAC (.m4a)</button>
    <button id="fmt-ogg" type="button">Vorbis (.ogg)</button>
    <button id="stop" type="button">Stop all</button>
  </div>
  <div id="status" role="status">Loading the list…</div>
</div>
<div id="sections"></div>

<script src="listen.js"></script>
</body>
</html>
