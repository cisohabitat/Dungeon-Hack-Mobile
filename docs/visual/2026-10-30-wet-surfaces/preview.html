<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wet surface audit</title>
<style>body{margin:24px;background:#171410;color:#e7ddca;font:16px system-ui}main{max-width:1100px;margin:auto}section{display:flex;flex-wrap:wrap;gap:16px;margin:24px 0}figure{margin:0}img{max-width:100%;height:auto}figcaption{margin:8px 0;color:#c3b69f}a{color:#dfba74}</style>
<main><h1>Oil, ice and water audit</h1><p>Existing v0.9.65 native rendering. Supplied comparison fixtures; <a href="README.md">scope and decisions</a>. These are reference captures, not new paintings.</p><div id="views"></div></main>
<script>const root=document.querySelector('#views');for(const width of [320,390])for(const kind of ['oil','ice','puddle','flooded']){const h=document.createElement('h2');h.textContent=width+'px '+kind;root.append(h);const section=document.createElement('section');for(const mode of ['normal','calm']){const figure=document.createElement('figure'),label=document.createElement('figcaption'),img=document.createElement('img');label.textContent=mode==='normal'?'Normal':'Calm';img.src='native/'+width+'-'+kind+'-'+mode+'.png';img.width=width;img.alt=width+'px '+kind+' in '+mode+' view';figure.append(label,img);section.append(figure);}root.append(section);}</script>
