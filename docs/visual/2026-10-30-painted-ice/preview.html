<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painted ice review</title>
<style>body{margin:24px;background:#171410;color:#e7ddca;font:16px system-ui}main{max-width:1100px;margin:auto}section{display:flex;flex-wrap:wrap;gap:16px;margin:24px 0}figure{margin:0}img{max-width:100%;height:auto}figcaption{margin:8px 0;color:#c3b69f}a{color:#dfba74}</style>
<main><h1>Painted ice fields</h1><p>Muted fracture detail in the original native footprint. <a href="README.md">Review and fixture scope</a>.</p><div id="views"></div></main>
<script>const root=document.querySelector('#views');for(const width of [320,390]){const h=document.createElement('h2');h.textContent=width+'px';root.append(h);for(const group of [[['Before audit','../2026-10-30-wet-surfaces/native/'+width+'-ice-normal.png'],['Painted Normal','recovery/'+width+'-normal.png'],['Painted Calm','recovery/'+width+'-calm.png']],[['Actual freeze','recovery/'+width+'-real-freeze-normal.png'],['Step toward ice','recovery/'+width+'-ice-approach.png'],['Native thaw','recovery/'+width+'-real-thaw.png']]]){const section=document.createElement('section');for(const[label,src]of group){const f=document.createElement('figure'),c=document.createElement('figcaption'),i=document.createElement('img');c.textContent=label;i.src=src;i.width=width;i.alt=width+'px '+label;f.append(c,i);section.append(f);}root.append(section);}}</script>
